services:
  db:
    build: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backfire
      POSTGRES_USER: backfire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backfire -d backfire"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://backfire:${POSTGRES_PASSWORD}@db:5432/backfire
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://backend:8000
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    environment:
      API_ORIGIN: http://backend:8000
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
